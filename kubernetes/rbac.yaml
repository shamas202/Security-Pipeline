apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-app
  namespace: production
  labels:
    app.kubernetes.io/name: devsecops-app
automountServiceAccountToken: false

---
# Role: minimal permissions — the app only needs to read its own ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devsecops-app
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
    resourceNames: ["devsecops-app-config"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devsecops-app
  namespace: production
subjects:
  - kind: ServiceAccount
    name: devsecops-app
    namespace: production
roleRef:
  kind: Role
  name: devsecops-app
  apiGroup: rbac.authorization.k8s.io
