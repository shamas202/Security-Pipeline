{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.fullname" . }}-deny-all
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.fullname" . }}-allow-ingress
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devsecops-app.fullname" . }}-allow-dns
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devsecops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
