apiVersion: v1
kind: Service
metadata:
  name: {{ include "devsecops-app.fullname" . }}
  labels:
    {{- include "devsecops-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devsecops-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
